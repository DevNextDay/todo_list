services:
  postgres:
    image: postgres:17
    container_name: pgx-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  app:
    image: todo-app:latest
    container_name: todo-app
    environment:
      DB_CONNECTION: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HTTP_SERVER_PORT: ${HTTP_SERVER_PORT}
    depends_on:
      - postgres
    ports:
      - "8080:8080"

volumes:
  postgres_data: